<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP — Micha &amp; Michael</title>
  <meta http-equiv="refresh" content="0; url=https://www.zola.com/wedding/michaellaandmichael2027/rsvp" />
  <link rel="canonical" href="https://www.zola.com/wedding/michaellaandmichael2027/rsvp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #rsvp-redirect {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: var(--cream);
    }
    .redirect-inner { max-width: 520px; }
    .redirect-inner h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 16px;
    }
    .redirect-inner p {
      color: var(--text-light);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 28px;
    }
    .redirect-inner .eyebrow { color: var(--gold); margin-bottom: 12px; }
    .redirect-link {
      display: inline-block;
      padding: 14px 34px;
      border: 1px solid var(--navy);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--navy);
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .redirect-link:hover { background: var(--navy); color: var(--white); }
  </style>
  <script>
    window.location.replace('https://www.zola.com/wedding/michaellaandmichael2027/rsvp');
  </script>
</head>
<body>

  <section id="rsvp-redirect">
    <div class="redirect-inner">
      <p class="eyebrow">Micha &amp; Michael · May 29, 2027</p>
      <h1>Taking you to our RSVP</h1>
      <p>You're being redirected to our Zola page. If nothing happens, use the link below.</p>
      <a class="redirect-link" href="https://www.zola.com/wedding/michaellaandmichael2027/rsvp">RSVP on Zola</a>
    </div>
  </section>

</body>
</html>
